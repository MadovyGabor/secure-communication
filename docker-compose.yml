# Demo: docker compose up -d --build
#
# Each service takes the same arguments as `python main.py` (see README):
#   server        listens on 0.0.0.0:8000 inside the private network
#   attacker      relays to server:8000 and listens on 127.0.0.1:8001 of its own network namespace
#   client-alice  username Alice; shares the attacker's network namespace and chats through the proxy
#   client-bob    username Bob; same as Alice
#
# Server audit log:   docker compose logs -f server
# Chat as Alice:      docker attach secure-chat-client-alice-1   (detach: Ctrl+P, Ctrl+Q; Ctrl+C quits the client)
# Chat as Bob:        docker attach secure-chat-client-bob-1
# Control the proxy:  docker attach secure-chat-attacker-1
# Another client:     docker compose run --rm client-alice client 127.0.0.1 8001 Carol
#                     (leave the name out to be Anonymous#N; use "server 8000" to bypass the proxy)
# Unsecure mode:      docker compose -f docker-compose.yml -f docker-compose.unsecure.yml up -d

name: secure-chat

# settings shared by every chat client; each client only adds its command and key volume
x-client: &client
  image: secure-chat:latest
  stdin_open: true
  tty: true
  network_mode: "service:attacker"
  depends_on:
    server:
      condition: service_healthy
    attacker:
      condition: service_healthy

services:
  server:
    build: .
    image: secure-chat:latest
    command: ["server", "0.0.0.0", "8000"]
    networks: [chat]
    volumes:
      - server-keys:/data
    healthcheck:
      # listening on port 8000 (0x1F40); reads /proc instead of connecting, which would show up as a chat client
      test: ["CMD-SHELL", "grep -q ':1F40 00000000:0000 0A' /proc/net/tcp"]
      interval: 2s
      retries: 15

  attacker:
    image: secure-chat:latest
    command: ["attack", "server", "8000"]
    stdin_open: true
    tty: true
    networks: [chat]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # proxy listening on 127.0.0.1:8001 (0100007F:1F41), so the clients do not connect too early
      test: ["CMD-SHELL", "grep -q '0100007F:1F41 00000000:0000 0A' /proc/net/tcp"]
      interval: 2s
      retries: 15

  client-alice:
    <<: *client
    command: ["client", "127.0.0.1", "8001", "Alice"]
    volumes:
      - alice-keys:/data

  client-bob:
    <<: *client
    command: ["client", "127.0.0.1", "8001", "Bob"]
    volumes:
      - bob-keys:/data

networks:
  chat:
    internal: true

volumes:
  server-keys:
  alice-keys:
  bob-keys:
